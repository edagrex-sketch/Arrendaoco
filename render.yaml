services:
  - type: web
    name: arrendaoco
    runtime: php
    region: ohio
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader \
        && npm ci \
        && npm run build \
        && php artisan storage:link
    startCommand: |
      php artisan migrate --force \
        && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: ArrendaOco
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://arrendaoco.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: BROADCAST_CONNECTION
        value: log
      - key: MAIL_MAILER
        value: log
